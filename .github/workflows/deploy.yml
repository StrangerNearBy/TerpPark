# Manual deploy to terppark.com.
#
# GitHub Pages' source is "GitHub Actions", so pushing to any branch publishes
# nothing. The site changes only when this workflow runs:
#
#   GitHub:   Actions tab -> "Deploy to terppark.com" -> Run workflow
#   Terminal: npm run deploy        (or: gh workflow run deploy.yml -f ref=dev)
#
# It refuses to deploy if tests fail, if docs/ is not rebuilt from the current
# source, if docs/CNAME is missing, or if `main` has commits the branch lacks.
# `main` is moved to the deployed commit, so `main` always equals what is live.
name: Deploy to terppark.com

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to publish
        required: true
        default: dev

permissions:
  contents: write   # move main to the deployed commit
  pages: write      # publish to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: deploy-terppark
  cancel-in-progress: false

jobs:
  # Job 1: check everything, move main, package docs/.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: node test.mjs

      - name: Check docs/ is built from the current source
        run: |
          node build.mjs
          node bundle-standalone.mjs
          cp src/engine.js docs/engine.js
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is out of date. Run 'npm run build' locally, commit docs/, then deploy again."
            git diff --stat -- docs
            exit 1
          fi

      - name: Check the custom domain is still set
        run: |
          test -f docs/CNAME && grep -qx 'terppark.com' docs/CNAME \
            || { echo "::error::docs/CNAME must contain terppark.com"; exit 1; }

      - name: Move main to this commit (fast-forward only)
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits that '${{ inputs.ref }}' does not. Merge main into it first."
            exit 1
          fi
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Summary
        run: echo "Packaged $(git rev-parse --short HEAD) from ${{ inputs.ref }}" >> "$GITHUB_STEP_SUMMARY"

  # Job 2: publish the package. GitHub's documented pattern keeps this in its own
  # job; in a single job deploy-pages could not see the artifact ("Found 0").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
