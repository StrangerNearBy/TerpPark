/* ------------------------------------------------------------------ *
 * Plain-English rule explanation.
 * The app's job is to state, for any lot: who may park, and when.
 * ------------------------------------------------------------------ */

const WHO = {
  permit_lot: (lot) => `Permit for lot ${lot} only`,
  faculty_staff: () => 'Faculty & staff permits only',
  open: () => 'Anyone — no permit needed',
  pay: () => 'Anyone — payment required',
  unknown: () => 'No published rule',
};

const DAY_LABEL = { 'mon-fri': 'Mon–Fri', 'sat-sun': 'Sat & Sun', all: 'Every day',
  mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };

/** "16:00" -> "4 PM", "07:30" -> "7:30 AM" */
function prettyTime(hhmm) {
  if (hhmm === '24:00' || hhmm === '00:00') return 'midnight';
  const [h, m] = hhmm.split(':').map(Number);
  const ampm = h < 12 ? 'AM' : 'PM';
  const hr = h % 12 === 0 ? 12 : h % 12;
  return m ? `${hr}:${String(m).padStart(2, '0')} ${ampm}` : `${hr} ${ampm}`;
}

/**
 * Full schedule for a lot, in the order it reads best: what applies now first,
 * then every other window. Used to render the "who can park here" breakdown.
 */
function explainLot(rules, lotId, restrictionClass, when = new Date()) {
  const special = lotId ? rules.special_lots?.[lotId] : null;
  const cls = rules.classes?.[restrictionClass];
  const windows = special?.windows ?? cls?.windows ?? [];

  const schedule = windows.map((w) => ({
    days: DAY_LABEL[w.days] ?? w.days,
    hours:
      w.from === '00:00' && (w.to === '24:00' || w.to === '00:00')
        ? 'All day'
        : `${prettyTime(w.from)} – ${prettyTime(w.to)}`,
    who: (WHO[w.access] ?? WHO.unknown)(lotId),
    access: w.access,
    free: w.access === 'open',
    active: inWindow(w, when),
  }));

  const active = schedule.find((s) => s.active) ?? null;
  const free = schedule.filter((s) => s.free);

  return {
    lot: lotId,
    label: cls?.label ?? null,
    summary: cls?.restriction_text ?? special?.text ?? null,
    requiredText: cls?.required_text ?? null,
    schedule,
    now: active,
    freeWindows: free,
    everFree: free.length > 0,
    adaOnly: !!special?.ada_only,
    gated: (rules.gated_lots?.lots ?? []).some(
      (l) => String(l).toLowerCase() === String(lotId).toLowerCase()
    ),
  };
}

  const strip = sp?.ada_only ? 'Accessible parking only'

        const days={'mon-fri':'Mon–Fri','sat-sun':'Sat–Sun',all:'daily'}[w?.days]??w?.days??'';
        return w ? `Valid lot ${x.lot} ${prettyTime(w.from)}–${prettyTime(w.to)} ${days}` : 'Special restrictions'; })()
    : STRIP[x.restrictionClass] ?? 'Special restrictions';
  const first = /^[A-Za-z]/.test(String(x.lot)) ? 'letter' : /^\d/.test(String(x.lot)) ? 'number' : null;
  return { ink, strip, first };
}
/* Lot type: UMD's database field first; otherwise UMD's own printed rule
   (map p.2): a code starting with a letter is faculty/staff, a number is student. */
function typeOf(x){
  if (x.lotType) return x.lotType;
  if (isOff(x) || x.lot==null) return null;
  return /^[A-Za-z]/.test(String(x.lot)) ? 'Faculty/Staff' : /^\d/.test(String(x.lot)) ? 'Student' : null;
}
/* "Lot JJ3" with the code in its sign ink. */
function titleHTML(x){
  const sg=signOf(x);
  if (!sg) return esc(title(x));
  const cap=`<span class="code c-${sg.ink}">${esc(x.lot)}</span>`;
  return x.type==='garage' ? `${cap}<span class="gname">${esc(x.garageName??'Garage')}</span>` : `Lot ${cap}`;
}
/* UMD's four visitor garages hold two kinds of space: the permit lot (B, 19, U2, …)
   and visitor pay-station spaces ($4/hr, 7 AM–midnight daily). The lot's status
   only covers its own spaces, so say which, and what the pay spaces cost. */
function visitorPay(x){
  if (x.type!=='garage' || !RULES.pay_parking.visitor_garages.includes(String(x.garageNumber))) return null;
  const parts=(x.garage?.parts??[]).filter(p=>/pay|visitor/i.test(p.lot));
  const n=parts.reduce((a,p)=>a+(p.spaces||0),0);
  const h=RULES.pay_parking.hours;
  return { spaces:n||null, text:`${RULES.pay_parking.rate.replace(' Daily','')}, ${prettyTime(h.from)}–${prettyTime(h.to)} daily` };
}
/* Paying: UMD pay areas use ParkMobile (zones from UMD's "ParkMobile Zones" map,
   data/parkmobile_zones.json). Off-campus lots get their own operator's route. */
const PZ = DATA.payZones;
function zoneFor(x){
  if (isOff(x)) return null;
  return (x.garageNumber && PZ.garages[x.garageNumber]?.zone) || PZ.lots[x.lot]?.zone || null;
}
function needsPay(x){
  if (isOff(x)) return !!PZ.off_campus[x.lot];
  return x.st.key==='pay' || !!visitorPay(x) || x.ex.schedule.some(s=>s.access==='pay');
}
function payBlock(x){
  if (!needsPay(x)) return '';
  if (isOff(x)){
    const o=PZ.off_campus[x.lot];
    return `<div class="payBox"><div class="ph"><b>How to pay</b></div><p>${esc(o.text)}</p>
      ${o.link?`<div class="row"><a class="btn" href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.link_label)}</a></div>`:''}</div>`;
  }
  const z=zoneFor(x);
  return `<div class="payBox">
    <div class="ph"><b>Pay with ParkMobile</b>${z?`<span class="zone"><span>ZONE</span><code>${z}</code>
      <button class="copy" data-copy="${z}">Copy</button></span>`:''}</div>
    <p>${z?`Open ParkMobile and enter zone <b>${z}</b>, or pay at the pay station.`
      :`Enter the zone number printed on the pay-station sign, or pay at the station.`}
      ${esc(RULES.pay_parking.rate.replace(' Daily',''))}, ${prettyTime(RULES.pay_parking.hours.from)}–${prettyTime(RULES.pay_parking.hours.to)} daily.</p>
    <div class="row"><a class="btn pm" href="${PZ.pay_link}" target="_blank" rel="noopener">Pay in ParkMobile</a>
      <a class="btn sm" href="${PZ.app_link}" target="_blank" rel="noopener">Get the app</a></div></div>`;
}
document.addEventListener('click',async(e)=>{ const b=e.target.closest('[data-copy]'); if(!b) return;
  try{ await navigator.clipboard.writeText(b.dataset.copy); b.textContent='Copied'; }
  catch{ b.textContent=b.dataset.copy; }
  setTimeout(()=>{ b.textContent='Copy'; },1600); });
const statusPill=(x,u)=>`<span class="st st-${x.st.key}"><i class="pip" style="--c:${x.st.c}"></i>${x.st.label}</span>${u?`<span class="until">${u}</span>`:''}`;
function signBlock(x){
  const sg=signOf(x); if(!sg) return '';
  const meaning = sg.ink==='black'
    ? '<b>Black sign:</b> anyone may park after 4 PM on weekdays and all day on weekends, no permit needed.'
    : '<b>Red sign:</b> this lot has extra restrictions; the strip under the lot code says which.';
  const who = sg.first==='letter' ? ' Starts with a <b>letter</b>, so it is a faculty/staff lot.'
    : sg.first==='number' ? ' Starts with a <b>number</b>, so it is a student lot.' : '';
  return `<div class="signRow"><div class="sign" aria-label="Lot sign">
      <span class="scode ink-${sg.ink}">${esc(x.lot)}</span><span class="strip ${sg.ink==='black'?'plain':''}">${esc(sg.strip)}</span></div>
    <p>${meaning}${who}</p></div>`;
}

/* "What kind of parking do you need?" — from TerpPark, but grounded in UMD's own
   lot-type field (ParkingRestriction table) instead of the letter/number guess.
   It filters; it never claims your permit is valid for a lot. */
const WHO_OPTS=[['any','Anyone'],['visitor','Visitor (no permit)'],['student','Student permit'],['faculty','Faculty/staff permit']];
function eligible(x){
  if (S.who==='any' || isOff(x)) return true;
  if (x.st.key==='free' || x.st.key==='pay') return true;
  if (S.who==='visitor') return false;
  const ov = S.who==='student' ? RULES.overflow.student : RULES.overflow.faculty_staff;
  if (ov.some(r=>matchesLot(r, x.lot))) return true;
  if (S.who==='student') return typeOf(x)==='Student';
  return typeOf(x)==='Faculty/Staff' || x.ex.now?.access==='faculty_staff';
}
const dist=(m)=> m<1000 ? `${m} m` : `${(m/1000).toFixed(1)} km`;
const spacesOf=(x)=> x.spaces ?? (x.garage?.complete ? x.garage.total_spaces : null);

/* ---------------- render ---------------- */
function sync(){
  syncTime();
  el('near').innerHTML=`Near <b>${esc(S.origin.name)}</b>`;
  renderExploreChips();
  if (S.explore){
    if (S.mode==='car') { rows=query(); renderTiles(); } else { const rs=placeRows(); rows=[]; renderModeTiles(rs); }
    renderExploreList(); drawMap();
    if (String(S.selected).startsWith('place:')) renderPlaceDetail(+String(S.selected).slice(6));
    return;
  }
  if (S.mode!=='car'){
    const rs=placeRows(); rows=[];
    renderModeTiles(rs); renderModeList(rs); drawMap();
    if (String(S.selected).startsWith('place:')) renderPlaceDetail(+String(S.selected).slice(6));
    return;
  }
  rows=query();
  renderTiles(); renderList(); drawMap();
  if (S.selected!=null && S.selected!==RULES_VIEW && !String(S.selected).startsWith('place:')) renderDetail(S.selected);
}

function renderTiles(){
  el('tiles').style.gridTemplateColumns='';
  const evN=rows.filter(x=>eligible(x)&&evOf(x)).length;
  el('evN').textContent=evN?`${evN} lot${evN===1?'':'s'} near here`:'none near here';
  el('evBtn').setAttribute('aria-pressed',String(S.ev));
  el('tiles').innerHTML=FILTERS.map(([k,label,c])=>{
    const base=rows.filter(x=>eligible(x)&&(!S.ev||!!evOf(x)));
    const n=k==='all'?base.length:base.filter(x=>x.st.key===k).length;
    return `<button class="tile ${S.filter===k?'on':''}" data-k="${k}"><span class="n">${n}</span>
      <span class="l">${c?`<i class="pip" style="--c:${c}"></i>`:''}${label}</span></button>`;
  }).join('');
}
el('who').innerHTML=WHO_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
el('who').onchange=(e)=>{ S.who=e.target.value; fitted=false; sync(); };
el('tiles').onclick=(e)=>{ const b=e.target.closest('.tile'); if(!b) return; const k=b.dataset.k;
  if (S.mode!=='car'){ S.mfilter[S.mode] = S.mfilter[S.mode]===k && k!=='all' ? 'all' : k; fitted=false; sync(); return; }
  S.filter = S.filter===k && k!=='all' ? 'all' : k; fitted=false; sync(); };
el('evBtn').onclick=()=>{ S.ev=!S.ev; fitted=false; sync(); };

function renderList(){
  const list=rows.filter(passes);
  const foot=`<p class="foot">Rules from the UMD Campus Parking Map and UMD's parking database.
<br>Posted signs always win. Space counts are totals, not live availability.<br><b>Beta.</b> Unofficial, not affiliated with UMD, no guarantees. <a href="#" data-about>Disclaimer</a></p>`;
  const HINT={
    visitor:'Lots anyone can use at this time (free or pay), plus off-campus parking.',
    student:'Lots UMD marks as student lots, student overflow, and anything open to all right now. Your permit still has to match the lot on the sign.',
    faculty:'Lots UMD marks as faculty/staff lots, faculty/staff overflow, and anything open to all right now. Your permit still has to match the lot on the sign.',
  };
  const hint=HINT[S.who]?`<div class="hint">${HINT[S.who]}</div>`:'';
  if(!list.length){ el('list').innerHTML=hint+`<div class="empty">No ${S.filter==='all'?'':FILTERS.find(f=>f[0]===S.filter)[1].toLowerCase()+' '}lots near here at this time.</div>`+foot; return; }
  el('list').innerHTML=list.map(x=>{
    const sp=spacesOf(x);
    const ev=evOf(x);
    const meta=[sp!=null?`${fmt(sp)} spaces`:null, ev?`EV charging${ev.ports?` (${ev.ports})`:''}`:null,
        isOff(x)?OFF[x.lot]?.operator?.replace(/\s*\(.*$/,''):typeOf(x),
        x.ex.adaOnly?'Accessible only':null, x.ex.gated?'Gated':null]
      .filter(Boolean).map(esc).join(' · ');
    const u=untilText(x);
    return `<button class="card ${S.selected===String(x.lot)?'on':''}" data-lot="${esc(String(x.lot))}">
      <div class="r1"><h3>${titleHTML(x)}${isOff(x)?'<span class="tag-off">Off campus</span>':''}</h3><span class="d">${dist(x.distance)} · ${x.walkMinutes} min</span></div>
      <div class="r2">${statusPill(x,u)}</div>
      ${(()=>{const vp=visitorPay(x); return vp&&x.lot?`<div class="r3 scope">${x.st.key==='pay'?'':`<b>Lot ${esc(x.lot)} spaces only.</b> `}Visitor spaces${vp.spaces?` (${fmt(vp.spaces)})`:''}: pay ${esc(vp.text)}${zoneFor(x)?` · ParkMobile ${zoneFor(x)}`:''}</div>`
        : (x.st.key==='pay' && zoneFor(x) ? `<div class="r3 scope">ParkMobile zone ${zoneFor(x)}</div>` : '');})()}
      ${meta||x.conflict?`<div class="r3">${meta}${x.conflict?`${meta?' · ':''}<span class="warn">Check sign</span>`:''}</div>`:''}
    </button>`;
  }).join('')+foot;
  el('list').insertAdjacentHTML('afterbegin', hint);
}
el('list').onclick=(e)=>{ const c=e.target.closest('.card'); if(!c) return;
  if (c.dataset.place!=null) openPlace(+c.dataset.place); else openDetail(c.dataset.lot); };

/* ---------------- detail ---------------- */
function dirLinks(lat,lon,name,primaryApple,travel='driving'){
  const g=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=${travel}`;
  // Apple's URL scheme has no cycling flag; leave it off so the app lets you pick.
  const a=`https://maps.apple.com/?daddr=${lat},${lon}&q=${encodeURIComponent(name)}${travel==='driving'?'&dirflg=d':''}`;
  const G=`<a class="btn ${primaryApple?'':'primary'}" href="${g}" target="_blank" rel="noopener">Google Maps</a>`;
  const A=`<a class="btn ${primaryApple?'primary':''}" href="${a}" target="_blank" rel="noopener">Apple Maps</a>`;
  return primaryApple ? A+G : G+A;
}
const isApple=/iPhone|iPad|Macintosh/.test(navigator.userAgent);

const WEEK=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function mergeDays(rows){
  const out=[];
  for (const r of rows){
    const prev=out[out.length-1], i=WEEK.indexOf(r.days);
    if (prev && i>0 && prev._last===i-1 && prev.hours===r.hours && prev.who===r.who){
      prev._last=i; prev.days=`${prev._first}–${WEEK[i]}`; prev.active=prev.active||r.active;
    } else out.push({...r, _first:r.days, _last:i>=0?i:-9});
  }
  return out;
}
function renderDetail(lot){
  const x=rows.find(r=>String(r.lot)===String(lot));

  if(!x){ closeDetail(); return; }
  const [lon,lat]=x.coordinates;
  const sp=spacesOf(x), ratio=x.spaces&&x.permitsSold?(x.permitsSold/x.spaces):null;
  const u=untilText(x);
  const notes=[];
  if(x.ex.summary) notes.push(`<p>${esc(x.ex.summary)}</p>`);
  if(x.umdRegulation||x.umdAdditional) notes.push(`<p><b>UMD parking database:</b> ${esc([x.umdRegulation,x.umdAdditional].filter(Boolean).join(' '))}</p>`);
  if(x.classSource==='umd_gis') notes.push(`<p>This lot has no colour on the printed map, so its schedule comes from UMD's parking database.</p>`);
  if((x.st.key==='pay'||x.type==='garage') && !isOff(x)) notes.push(`<p><b>Pay to park:</b> ${esc(RULES.pay_parking.rate)}. ${esc(RULES.pay_parking.text)}</p>`);
  if(x.ex.gated) notes.push(`<p><b>Gated lot.</b> ${esc(RULES.gated_lots.text)}</p>`);
  if(x.ex.adaOnly) notes.push(`<p><b>Accessible parking.</b> ${esc(RULES.ada.text)}</p>`);
  if(x.garage){
    notes.push(`<p><b>${esc(x.garage.name)}: ${fmt(x.garage.total_spaces)} spaces</b>${x.garage.complete?'':' listed — UMD counts only part of this garage'}.</p>
      <ul class="parts">${x.garage.parts.map(p=>`<li><span>${esc(p.lot)}</span><span>${fmt(p.spaces)}</span></li>`).join('')}</ul>`);
  }
  if(ratio) notes.push(`<p><b>${fmt(x.permitsSold)} permits sold</b> for ${fmt(x.spaces)} spaces (${ratio.toFixed(2)} per space). UMD oversells commuter lots on purpose; not everyone parks at once.</p>`);
  if(!isOff(x)) notes.push(`<p><b>Special events:</b> during major campus events and game days, lots (even black-sign ones)
    can be restricted. Signs go up at the entrance in advance; see
    <a href="https://www.transportation.umd.edu/parking/athletics-parking" target="_blank" rel="noopener">UMD athletics parking</a>.</p>`);
  if(isOff(x)) notes.push(`<p>Not a UMD lot: UMD permits do not apply. ${x.ex.schedule.length?'Hours outside those listed are unconfirmed.':''}
    Posted signs always take priority.</p>`);
  else notes.push(`<p>Grid ${esc(x.gridLocation??'—')} on the printed campus map. Posted signs always take priority.</p>`);
  const o=isOff(x)?OFF[x.lot]:null;
  const CONF={high:'High — checked against the operator and OpenStreetMap',medium:'Medium — some details from third-party listings',low:'Low — location only; price and hours unconfirmed'};
  const offInfo=o?`<div class="info">
      ${o.address?`<div><span class="k">Address</span>${esc(o.address)}</div>`:''}
      ${o.pricing?`<div><span class="k">Price</span>${esc(o.pricing)}</div>`:''}
      ${o.hours?`<div><span class="k">Hours</span>${esc(o.hours)}</div>`:''}
      ${o.operator?`<div><span class="k">Run by</span>${esc(o.operator)}</div>`:''}
      ${o.confidence?`<div><span class="k">How sure we are</span>${esc(CONF[o.confidence]??o.confidence)}</div>`:''}
      ${o.note?`<div><span class="k">Good to know</span>${esc(o.note)}</div>`:''}
    </div>`:'';

  d.innerHTML=`
    <div class="dTop">${HOME_LINK}<button class="back" id="dBack" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div>
    <div class="dBody">
      <h2>${isOff(x)?esc(fullTitle(x)):titleHTML(x)}</h2>
      <div class="sub">${x.type==='garage'&&x.lot?'Lot '+esc(x.lot)+' · ':''}${x.distance<20 ? (isOff(x)?'Off-campus public parking':'UMD parking lot') : `${dist(x.distance)} · ${x.walkMinutes} min walk from ${esc(S.origin.name)}`}</div>
      <div class="status">${statusPill(x,u)}</div>
      ${(()=>{const ev=evOf(x); return ev?`<div class="evline"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>EV charging here${ev.ports?`: ${ev.ports} port${ev.ports===1?'':'s'}`:''}${ev.unknown&&ev.ports?' (plus some uncounted)':''}</div>`:'';})()}
      ${(()=>{const vp=visitorPay(x); return vp&&x.lot?`<div class="notice" style="background:#FDF0DC;border-color:#F3D3A1;color:#5c3800">
        <b>Two kinds of parking in this garage.</b> The status above is for <b>lot ${esc(x.lot)}</b> permit spaces.
        The garage's visitor pay-station spaces${vp.spaces?` (${fmt(vp.spaces)})`:''} cost ${esc(vp.text)}, free hour or not. Check the sign on each level.</div>`:'';})()}
      ${signBlock(x)}
      ${x.conflict?`<div class="notice"><b>Check the sign.</b> ${esc(x.conflict)} This app follows the printed map.</div>`:''}
      <div class="stats">
        <div class="stat"><div class="k">Spaces</div><div class="v">${fmt(sp)}</div></div>
        <div class="stat"><div class="k">Lot type</div><div class="v sm">${esc(isOff(x)?'Off campus':(typeOf(x)??'—'))}</div></div>
        <div class="stat"><div class="k">Walk</div><div class="v">${x.walkMinutes} min</div></div>
      </div>
      ${offInfo}
      <div class="dirs">${dirLinks(lat,lon,isOff(x)?fullTitle(x)+', College Park, MD':title(x)+', University of Maryland, College Park, MD',isApple)}</div>
      ${payBlock(x)}
      <div class="sec">Who can park, and when</div>
      <div class="sched">${x.ex.schedule.length?mergeDays(x.ex.schedule).map(s=>`<div class="${s.active?'act':''}">
        <span class="when">${s.days}<br>${s.hours}</span><span class="who">${esc(s.who)}${s.active?'<small>In effect at the selected time</small>':''}</span></div>`).join('')
        :`<div><span class="when">—</span><span class="who">No published schedule<small>See the notes below and the sign at the lot.</small></span></div>`}</div>
      <details class="more"><summary>Rules &amp; details</summary><div class="in">${notes.join('')}</div></details>
    </div>`;
  el('dBack').onclick=()=>closeDetail();
}
function openDetail(lot){
  S.selected=String(lot); renderDetail(lot);
  const d=el('detail'); showSheet();
  d.querySelector('.dBody').scrollTop=0;

}

}
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && S.selected!=null) closeDetail(); });

(()=>{ let y0=null, dy=0; const d=el('detail');
  d.addEventListener('touchstart',(e)=>{ const body=d.querySelector('.dBody');
    // Drag from the handle/top bar, or from the content when it is scrolled to the top.
    if (!mobile() || (body && body.contains(e.target) && body.scrollTop>0)) { y0=null; return; }

/* ---------------- map ---------------- */
let map=null, layers=null, fitted=false;
function initMap(){
  map=L.map('map',{zoomControl:false}).setView([S.origin.coords[1],S.origin.coords[0]],16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  layers={ lots:L.layerGroup().addTo(map), places:L.layerGroup().addTo(map),
           pins:L.layerGroup().addTo(map), origin:L.layerGroup().addTo(map) };
  // Place names show once zoomed in far enough to fit them; icons alone before that.
  const labelZoom=()=>{ el('map').classList.toggle('labels', map.getZoom()>=18); el('map').classList.toggle('far', map.getZoom()<17); };
  map.on('zoomend', labelZoom); labelZoom();
  drawPlaces();
}
function drawOrigin(){
  L.marker([S.origin.coords[1],S.origin.coords[0]],{interactive:false,
    icon:L.divIcon({className:'',iconSize:null,html: S.origin.kind==='me' ? '<div class="me"></div>'
      : `<div class="dest"><span class="lbl">${esc(S.origin.name)}</span><span class="stem"></span><span class="tip"></span></div>`}),
    zIndexOffset:1200}).addTo(layers.origin);
}
function drawMap(keepView){
  if(!map) initMap();
  el('map').classList.toggle('explore-on', !!S.explore);
  if (S.explore) return drawExploreMap(keepView);
  if (S.mode!=='car') return drawModeMap(keepView);
  const shown=rows.filter(passes);
  layers.lots.clearLayers(); layers.pins.clearLayers(); layers.origin.clearLayers();

  // Outlines stay quiet; only the selected lot is coloured.
  const sel=S.selected!=null?String(S.selected).toLowerCase():null;
  const selRow=sel?rows.find(r=>String(r.lot).toLowerCase()===sel):null;
  L.geoJSON(DATA.lotPolygons,{interactive:false,style:(f)=>{
    const isSel=sel && String(f.properties.NAME).toLowerCase()===sel;
    return isSel ? {color:HEX[selRow?.st.key]??'#141414',weight:2,opacity:1,fillOpacity:.22}
                 : {color:'#a9a9a3',weight:.8,opacity:.55,fillColor:'#c9c8c2',fillOpacity:.22};
  }}).addTo(layers.lots);

  const LABELLED=mobile()?8:12;
  shown.forEach((x,i)=>{
    const isSel=S.selected===String(x.lot), ll=[x.coordinates[1],x.coordinates[0]];
    const sp=spacesOf(x), sg=signOf(x);
    const html = (i<LABELLED||isSel)
      ? `<div class="pin ${sg?'s-'+sg.ink:''} ${isSel?'sel':''}"><i class="pip" style="--c:${x.st.c}"></i>${x.type==='garage'?'P ':''}${esc(x.lot??'')}${sp!=null?`<span class="cap">${fmt(sp)}</span>`:''}${visitorPay(x)?'<span class="cap">· $</span>':''}</div>`
      : `<div class="mdot" style="background:${x.st.c};--ring:${sg?`var(--sign-${sg.ink})`:'#8E8E87'}"></div>`;
    L.marker(ll,{icon:L.divIcon({className:'',iconSize:null,html}),zIndexOffset:isSel?1000:(i<LABELLED?500-i:100),
      keyboard:false}).addTo(layers.pins).on('click',()=>openDetail(String(x.lot)));
  });

  drawOrigin();

  const visible = el('mapPane').offsetParent!==null;
  if(!visible) return;
  if(keepView && selRow){ map.panTo([selRow.coordinates[1],selRow.coordinates[0]]); return; }
  if(!fitted && shown.length){
    const b=L.latLngBounds([[S.origin.coords[1],S.origin.coords[0]],...shown.slice(0,10).map(x=>[x.coordinates[1],x.coordinates[0]])]);
    map.fitBounds(b,{padding:[50,50],maxZoom:17}); fitted=true;
  }
}

const MODES={
  moto:{ colour:'#141414', radius:1600, travel:'driving',

    filters:[['all','All',()=>true],['lock','Lock point',(p)=>p.lock===true],['count','Space count',(p)=>p.spaces!=null]],
    hint:`<b>Motorcycles</b> need DOTS registration (a CLPR permit) and may park in your assigned lot or a designated motorcycle area.

/* EV chargers, attached to the lot they serve: "Lot NN" by code, "X Garage" to that
   garage's lots, anything else to a lot within 60 m. Others stay map-only. */
const EV=(()=>{
  const m=new Map(), lots=DATA.parking.features.filter(f=>f.geometry);
  const add=(k,ports)=>{ const e=m.get(k)??{n:0,ports:0,unknown:false}; e.n++; if(ports!=null) e.ports+=Number(ports); else e.unknown=true; m.set(k,e); };
  for (const f of PF){
    const p=f.properties; if (p.category!=='EV charging') continue;
    const code=String(p.name).match(/^Lot (\S+)$/)?.[1];
    let keys=[];
    if (code) { const hit=lotIndex.get(code.toLowerCase()); if (hit) keys=[String(hit.properties.lot)]; }
    else if (/ Garage$/.test(p.name)) {
      const g=p.name.replace(/ Garage$/,'');
      keys=[...new Set(lots.filter(l=>l.properties.garage_name?.startsWith(g+' ')).map(l=>String(l.properties.lot)))];
    } else {
      const near=lots.filter(l=>l.properties.lot).map(l=>[l,engine.haversine(f.geometry.coordinates,l.geometry.coordinates)]).sort((a,b)=>a[1]-b[1])[0];
      if (near && near[1]<=60) keys=[String(near[0].properties.lot)];
    }
    keys.forEach(k=>add(k,p.chargers));
  }
  return m;
})();
function evOf(x){ return EV.get(String(x.lot)) ?? null; }

function placeRows(){
  const M=MODES[S.mode], o=S.origin.coords;
  return PF.map((f,idx)=>({f,idx,p:f.properties,d:Math.round(engine.haversine(o,f.geometry.coordinates))}))
    .filter(r=>M.match(r.p) && r.d<=M.radius).sort((a,b)=>a.d-b.d);
}

  if (p.category==='Bike room') return { t:`Bike room — ${p.name}`, s:p.room?`Room ${p.room}`:'' };
  return { t:p.name, s:p.building && p.building!==p.name ? p.building : '' };
}

  const stats=[p.loops?['Loops',p.loops]:null, p.spaces!=null?['Spaces',p.spaces]:null,
    p.covered!=null?['Covered',p.covered?'Yes':'No']:null, p.lock!=null?['Lock point',p.lock?'Yes':'No']:null,
    ['Walk',`${Math.max(1,Math.round(d0/80))} min`]].filter(Boolean).slice(0,3);
  const link=p.access && String(p.access).match(/https?:\/\/\S+/)?.[0];
  el('detail').innerHTML=`<div class="dTop">${HOME_LINK}<button class="back" id="dBack" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div>
    <div class="dBody">
      <h2>${esc(t)}</h2>
      <div class="sub">${esc([s, d0>=20?`${dist(d0)} from ${S.origin.name}`:null].filter(Boolean).join(' · '))}</div>
      <div class="status"><span class="mtag big" style="--mc:${M.colour}">${esc(p.category)}</span>
        ${p.hours?`<span class="until">${esc(p.hours==='24/7'?'Open 24/7':p.hours)}</span>`:''}</div>
      <div class="stats" style="grid-template-columns:repeat(${stats.length},1fr)">${stats.map(([k,v])=>
        `<div class="stat"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
      ${p.access?`<div class="notice">${esc(cleanAccess(p.access))}${link?` <a href="${esc(link)}" target="_blank" rel="noopener">Request access</a>`:''}</div>`:''}
      <div class="dirs">${dirLinks(lat,lon,t+', University of Maryland, College Park, MD',isApple,M.travel)}</div>
      ${p.vendors?.length?`<div class="sec">Inside (${p.vendors.length})</div><div class="sched">${p.vendors.map(v=>
        `<div><span class="when" style="grid-column:1/-1;color:var(--ink);font-size:14px;font-weight:650">${v.hours
          ?`<a href="${esc(v.hours)}" target="_blank" rel="noopener" style="color:inherit">${esc(v.name)}</a> <span style="color:var(--muted);font-weight:500">· hours</span>`
          :esc(v.name)}</span></div>`).join('')}</div>`:''}
      <button class="parkHereBtn" data-parkhere="${idx}">Find parking near here</button>
      ${p.description?`<p class="credit" style="color:var(--ink-2)">${esc(p.description.length>320?p.description.slice(0,317)+'…':p.description)}</p>`:''}
      ${p.also?.length?`<p class="credit">Also: ${esc(p.also.join(', '))}</p>`:''}
      ${p.room?`<p class="credit">Room ${esc(p.room)}${p.building?` · ${esc(p.building)}`:''}</p>`:''}
      ${p.website?`<p class="credit"><a href="${esc(p.website.startsWith('http')?p.website:'https://'+p.website)}" target="_blank" rel="noopener">${/veoride/.test(p.website)?'Veo rentals at UMD':'Website'}</a></p>`:''}
      ${M.hint?`<div class="hint" style="margin-top:14px">${M.hint}</div>`:''}
    </div>`;
  el('dBack').onclick=()=>closeDetail();
}
function openPlace(idx){
  S.selected='place:'+idx; renderPlaceDetail(idx);
  const d=el('detail'); showSheet(); d.querySelector('.dBody').scrollTop=0;
  if (S.explore) renderExploreList(); else if (S.mode!=='car') renderModeList(placeRows());
  drawMap(true);
}
function drawModeMap(keepView){
  layers.lots.clearLayers(); layers.pins.clearLayers(); layers.origin.clearLayers(); layers.places.clearLayers();
  const M=MODES[S.mode], fn=M.filters.find(f=>f[0]===S.mfilter[S.mode])[2];
  const rs=placeRows().filter(r=>fn(r.p));
  rs.forEach((r,i)=>{
    const [lon,lat]=r.f.geometry.coordinates, sel=S.selected==='place:'+r.idx, n=r.p.loops??r.p.spaces, lab=i<12||sel;
    // Bike pins in UMD gold with black text; motorcycle pins black.
    const html= lab ? `<div class="mpin ${sel?'sel':''}" style="--mc:${M.pin??M.colour};color:${M.pinInk??'#fff'}">${glyph(r.p)}${n!=null?`<span>${n}</span>`:''}</div>`
      : `<div class="mdot" style="background:${M.pin??M.colour};--ring:${M.pinInk??'#fff'}"></div>`;
    L.marker([lat,lon],{icon:L.divIcon({className:'',iconSize:null,html}),zIndexOffset:sel?1000:(lab?500-i:100),keyboard:false})
      .addTo(layers.pins).on('click',()=>openPlace(r.idx));
  });
  drawOrigin();
  if (el('mapPane').offsetParent===null) return;
  const selR=rs.find(r=>S.selected==='place:'+r.idx);
  if (keepView && selR){ map.panTo([selR.f.geometry.coordinates[1],selR.f.geometry.coordinates[0]]); return; }
  if (!fitted){
    const pts=[[S.origin.coords[1],S.origin.coords[0]],...rs.slice(0,10).map(r=>[r.f.geometry.coordinates[1],r.f.geometry.coordinates[0]])];
    map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:18}); fitted=true;
  }
}
function setMode(m){
  S.mode=m; lsSet('terp-mode',m); document.body.dataset.mode=m;
  [...el('modes').children].forEach(b=>{ b.classList.toggle('on',b.dataset.m===m); b.setAttribute('aria-selected',String(b.dataset.m===m)); });
  closeDetail(false); fitted=false;
  if (map && m==='car') drawPlaces();
  sync(); resetScroll(); layoutMap();
}
el('modes').onclick=(e)=>{ const b=e.target.closest('button[data-m]'); if(b && b.dataset.m!==S.mode) setMode(b.dataset.m); };

/* ---------------- explore: browse a kind of place, like map category chips ---------------- */
const LANDMARK_CATS=['Landmark','Arts','Research','Student life','Athletics','Green campus','Ghost tour','Testudo statue','Area','Residential community'];
const EXPLORE=[
  ['dining','Dining','fork',['Dining hall']],
  ['cafe','Cafes','cup',['Cafe']],
  ['eat','Restaurants','fork',['Food court','Restaurant']],
  ['shop','Shops','bag',['Shop','Food pantry','Farmers market']],
  ['library','Libraries','book',['Library']],
  ['maker','Makerspaces','tool',['Makerspace','Terrapin Tech']],
  ['restroom','Restrooms','wc',['All-gender restroom','Family restroom']],
  ['family','Family rooms','baby',['Lactation room','Baby changing','Adult changing table']],
  ['health','Health','plus',['Health','Disability services','Hearing & speech']],
  ['landmark','Landmarks','star',LANDMARK_CATS],
  ['shuttle','Shuttle','bus',['Shuttle-UM stop']],
  ['ev','EV','bolt',['EV charging']],
];
S.explore=null;
const exploreDef=()=>EXPLORE.find(e=>e[0]===S.explore);
function exploreRows(){
  const [, , , cats]=exploreDef(), o=S.origin.coords;
  return PF.map((f,idx)=>({f,idx,p:f.properties,d:Math.round(engine.haversine(o,f.geometry.coordinates))}))
    .filter(r=>cats.includes(r.p.category)).sort((a,b)=>a.d-b.d).slice(0,60);
}
const exploreColour=(cats)=>{ const f=PF.find(f=>cats.includes(f.properties.category)); return placeColour[f?.properties.group] ?? '#475569'; };
function renderExploreChips(){
  el('explore').innerHTML=EXPLORE.map(([k,label,ic,cats])=>`<button class="xchip ${S.explore===k?'on':''}" data-x="${k}"
    style="--xc:${exploreColour(cats)}" aria-pressed="${S.explore===k}">${svg(ICON[ic])}${label}</button>`).join('');
}
el('explore').onclick=(e)=>{ const b=e.target.closest('[data-x]'); if(!b) return;
  S.explore = S.explore===b.dataset.x ? null : b.dataset.x;
  closeDetail(false); fitted=false; sync(); resetScroll();
  if (!S.explore && map) drawPlaces(); };
function exploreTitle(p){
  if (p.group==='services') return { t: p.building ?? p.name, s: p.category };
  return { t: p.name, s: [p.category, p.building && p.building!==p.name ? p.building : null].filter(Boolean).join(' · ') };
}
function renderExploreList(){
  const [k,label,ic,cats]=exploreDef(), rs=exploreRows(), c=exploreColour(cats);
  const head=`<div class="xhead"><b>${label}</b><span class="n">${rs.length} near ${esc(S.origin.name)}</span>
    <button id="xBack">Back to parking</button></div>`;
  el('list').innerHTML=head+(rs.length?rs.map(r=>{ const {t,s}=exploreTitle(r.p);
    return `<button class="card ${S.selected==='place:'+r.idx?'on':''}" data-place="${r.idx}">
      <div class="r1"><h3>${esc(t)}</h3><span class="d">${dist(r.d)} · ${Math.max(1,Math.round(r.d/80))} min</span></div>
      <div class="r2"><span class="mtag" style="--mc:${c}">${esc(s.split(' · ')[0])}</span>${s.includes(' · ')?`<span class="ftag">${esc(s.split(' · ').slice(1).join(' · '))}</span>`:''}
        ${r.p.room?`<span class="ftag">Room ${esc(r.p.room)}</span>`:''}</div>
      ${r.p.vendors?.length?`<div class="r3">${esc(r.p.vendors.slice(0,4).map(v=>v.name).join(', '))}${r.p.vendors.length>4?` +${r.p.vendors.length-4} more`:''}</div>`:''}
    </button>`; }).join(''):`<div class="empty">None found near here.</div>`);
  el('xBack').onclick=()=>{ S.explore=null; closeDetail(false); fitted=false; sync(); if(map) drawPlaces(); };
}
function drawExploreMap(keepView){
  layers.lots.clearLayers(); layers.pins.clearLayers(); layers.origin.clearLayers(); layers.places.clearLayers();
  const rs=exploreRows(), [, , , cats]=exploreDef(), c=exploreColour(cats);
  rs.forEach((r,i)=>{ const [lon,lat]=r.f.geometry.coordinates, sel=S.selected==='place:'+r.idx, {t}=exploreTitle(r.p);
    const html=`<div class="picon ${i<5||sel?'top':''}" style="--pc:${c}"><span class="ic" style="${sel?'transform:scale(1.25);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--you)':''}">${svg(iconFor(r.p))}</span><span class="nm">${esc(t)}</span></div>`;
    L.marker([lat,lon],{icon:L.divIcon({className:'',iconSize:null,html}),zIndexOffset:sel?1000:0,keyboard:false})
      .addTo(layers.places).on('click',()=>openPlace(r.idx)); });
  drawOrigin();
  if (el('mapPane').offsetParent===null) return;
  const selR=rs.find(r=>S.selected==='place:'+r.idx);
  if (keepView && selR){ map.panTo([selR.f.geometry.coordinates[1],selR.f.geometry.coordinates[0]]); return; }
  if (!fitted && rs.length){
    map.fitBounds(L.latLngBounds([[S.origin.coords[1],S.origin.coords[0]],...rs.slice(0,5).map(r=>[r.f.geometry.coordinates[1],r.f.geometry.coordinates[0]])]),
      {padding:[50,50],maxZoom:18}); fitted=true;
  }
}
document.addEventListener('click',(e)=>{ const b=e.target.closest('[data-parkhere]'); if(!b) return;
  const f=PF[+b.dataset.parkhere]; S.explore=null; setOrigin(f); if (map) drawPlaces(); });

/* ---------------- home ---------------- */
const [seed]=engine.searchBuildings('McKeldin Library');
const HOME={coords:seed.geometry.coordinates,name:seed.properties.name};
/* Tapping the logo/title: back to the starting screen, like any app's home. */
function goHome(){
  closeDetail(false);
  S.origin={...HOME}; S.filter='all'; S.who='any'; S.when=new Date(); S.live=true; S.ev=false; S.mfilter={moto:'all',bike:'all'}; S.explore=null;
  el('q').value=''; el('sugg').hidden=true; el('who').value='any';
  el('timePick').hidden=true; el('whenBtn').setAttribute('aria-expanded','false');
  el('placesPanel').hidden=true; el('placesBtn').classList.remove('on');
  if(map) map.closePopup();
  fitted=false; setView('list'); sync(); if(map) drawPlaces();
  resetScroll();
}
el('homeBtn').onclick=(e)=>{ e.preventDefault(); goHome(); };
el('detail').addEventListener('click',(e)=>{ if(e.target.closest('[data-home]')){ e.preventDefault(); goHome(); } });

/* ---------------- beta / disclaimer ---------------- */
const DISC_KEY='terp-disclaimer-v1';
if (!lsGet(DISC_KEY)) el('devBanner').hidden=false;
el('devClose').onclick=()=>{ el('devBanner').hidden=true; lsSet(DISC_KEY,'seen'); layoutMap(); };
el('devMore').onclick=()=>openRules();
document.addEventListener('click',(e)=>{ if(e.target.closest('[data-about]')){ e.preventDefault(); openRules(); } });

/* ---------------- boot ---------------- */
buildDays();
S.origin={...HOME};
document.body.dataset.mode=S.mode;
[...el('modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
setView('list');
sync();
</script>
</body>
